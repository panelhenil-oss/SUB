<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script Update</title>
  <meta name="description" content="Get the latest scripts." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { background: #06070a; margin: 0; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #5c6079; font: 14px Inter, sans-serif; }
    #boot a { color: #8b6bff; }
  </style>
</head>
<body>
  <div id="boot"></div>
  <!--
    POKRETAČ — ovaj fajl se NIKAD ne mijenja.
    Svaki put učitava najnoviji config.js (sa jedinstvenom adresom),
    pa ni browser ni GitHub ne mogu da pokažu staru verziju sajta.
    Sadržaj sajta je u config.js (pravi ga Script Update Editor).
  -->
  <script>
  (function () {
    var boot = document.getElementById('boot');
    var slow = setTimeout(function () { boot.textContent = 'Loading…'; }, 600);
    function fail() {
      clearTimeout(slow);
      boot.innerHTML = 'Could not load the page. <a href="javascript:location.reload()">Try again</a>';
    }
    var c = document.createElement('script');
    c.src = 'config.js?t=' + Date.now();
    c.onerror = fail;
    c.onload = function () {
      var cfg = window.SITE_CONFIG;
      if (!cfg) return fail();
      var kind = cfg.type === 'update' ? 'update' : 'hub';
      var v = encodeURIComponent(cfg.version || Date.now());
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = kind + '.css?v=' + v;
      css.onload = css.onerror = function () {
        var js = document.createElement('script');
        js.src = kind + '.js?v=' + v;
        js.onload = function () { clearTimeout(slow); boot.remove(); };
        js.onerror = fail;
        document.body.appendChild(js);
      };
      document.head.appendChild(css);
    };
    document.head.appendChild(c);
  })();
  </script>
</body>
</html>
